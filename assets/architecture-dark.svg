<text x="955.0" y="158" class="sans t b" font-size="19" text-anchor="middle">SQLite</text>
<text x="955.0" y="181" class="mono m" font-size="14" text-anchor="middle">memory.db · WAL</text>
<rect x="880.0" y="198" width="150" height="28" rx="14.0" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="955.0" y="217.04" class="sans a" font-size="14" text-anchor="middle">FTS5 trigram</text>
<rect x="880.0" y="238" width="150" height="28" rx="14.0" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="955.0" y="257.04" class="sans a" font-size="14" text-anchor="middle">embeddings</text>
<path d="M420,244 V348" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="432" y="302" class="mono a b" font-size="14" text-anchor="start">--remote</text>
<rect x="330" y="350" width="180" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="420" y="381" class="sans t b" font-size="17" text-anchor="middle">REST client</text>
<text x="420" y="404" class="sans m" font-size="14" text-anchor="middle">same Store API</text>
<path d="M510,386 H588" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="549" y="374" class="mono m" font-size="14" text-anchor="middle">HTTP</text>
<rect x="590" y="350" width="180" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="680" y="381" class="mono t b" font-size="15" text-anchor="middle">serve --http-api</text>
<text x="680" y="404" class="sans m" font-size="14" text-anchor="middle">on the central host</text>
<path d="M680,350 V246" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<rect x="850" y="350" width="210" height="72" rx="10" fill="#0D1117" stroke="#9198A1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="955" y="381" class="sans t b" font-size="17" text-anchor="middle">Ollama</text>
<text x="955" y="404" class="sans m" font-size="14" text-anchor="middle">optional · embeddings</text>
<path d="M770,226 H810 V386 H848" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<path d="M40,384 H84" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="96" y="389" class="sans m" font-size="14" text-anchor="start">data path</text>
<path d="M40,412 H84" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="96" y="417" class="sans m" font-size="14" text-anchor="start">optional</text>
<text x="40" y="462" class="sans m" font-size="14" text-anchor="start">Remote mode: the central host runs the same binary; clients need no database and no Ollama.</text>
