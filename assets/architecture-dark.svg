<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">memory-mcp architecture</title>
<desc id="desc">CLI, MCP server and Claude Code hooks call a common db.Store interface, backed locally by internal/db over SQLite (FTS5 trigram plus embeddings), or with --remote by a REST client talking to serve --http-api on another host. Ollama is optional and provides embeddings.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t  { fill: #E6EDF3; }
  .m  { fill: #9198A1; }
  .a  { fill: #A196FF; }
  .oa { fill: #0D1117; }
  .b  { font-weight: 600; }
  .cap { font-size: 14px; letter-spacing: 1.2px; font-weight: 600; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#9198A1"/>
  </marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#A196FF"/>
  </marker>
</defs>
<rect width="1100" height="480" fill="#0D1117"/>
<text x="40" y="44" class="sans m cap" font-size="16" text-anchor="start">FRONT-ENDS</text>
<text x="330" y="44" class="sans m cap" font-size="16" text-anchor="start">INTERFACE</text>
<text x="590" y="44" class="sans m cap" font-size="16" text-anchor="start">ENGINE</text>
<text x="850" y="44" class="sans m cap" font-size="16" text-anchor="start">STORAGE</text>
<rect x="40" y="70" width="220" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="60" y="101" class="sans t b" font-size="17" text-anchor="start">CLI</text>
<text x="60" y="124" class="sans m" font-size="14" text-anchor="start">store · search · list …</text>
<rect x="40" y="160" width="220" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="60" y="191" class="sans t b" font-size="17" text-anchor="start">MCP server</text>
<text x="60" y="214" class="sans m" font-size="14" text-anchor="start">stdio · Streamable HTTP</text>
<rect x="40" y="250" width="220" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="60" y="281" class="sans t b" font-size="17" text-anchor="start">Claude Code hooks</text>
<text x="60" y="304" class="sans m" font-size="14" text-anchor="start">context · recall · summarize</text>
<path d="M260,106 H295" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260,196 H295" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260,286 H295" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
