<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Claude Code hook lifecycle</title>
<desc id="desc">SessionStart runs context --hook to inject global rules and project memories; every UserPromptSubmit runs recall --hook to inject up to 3 relevant memories in under 300 ms; SessionEnd runs summarize --hook to write a session summary in the background. Memories flow from the SQLite store into the agent context and back.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t  { fill: #E6EDF3; }
  .m  { fill: #9198A1; }
  .a  { fill: #A196FF; }
  .oa { fill: #0D1117; }
  .b  { font-weight: 600; }
  .cap { font-size: 14px; letter-spacing: 1.2px; font-weight: 600; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#9198A1"/>
  </marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#A196FF"/>
  </marker>
</defs>
<rect width="1100" height="420" fill="#0D1117"/>
<path d="M60,92 H1036" fill="none" stroke="#30363D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="1040" y="78" class="sans m" font-size="14" text-anchor="end">time</text>
<text x="210" y="58" class="sans t b" font-size="16" text-anchor="middle">SessionStart</text>
<text x="550" y="58" class="sans t b" font-size="16" text-anchor="middle">UserPromptSubmit × N</text>
<text x="890" y="58" class="sans t b" font-size="16" text-anchor="middle">SessionEnd</text>
<circle cx="210" cy="92" r="7" fill="#A196FF"/>
<circle cx="890" cy="92" r="7" fill="#A196FF"/>
<circle cx="500" cy="92" r="6" fill="#0D1117" stroke="#A196FF" stroke-width="1.5"/>
<circle cx="550" cy="92" r="6" fill="#0D1117" stroke="#A196FF" stroke-width="1.5"/>
<circle cx="600" cy="92" r="6" fill="#0D1117" stroke="#A196FF" stroke-width="1.5"/>
<circle cx="550" cy="92" r="3" fill="#A196FF"/>
<path d="M210,101 V126" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="60" y="128" width="300" height="140" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="80" y="160" class="mono a b" font-size="17" text-anchor="start">context --hook</text>
<text x="80" y="188" class="sans t" font-size="15" text-anchor="start">Injects global rules and the</text>
<text x="80" y="210" class="sans t" font-size="15" text-anchor="start">project's memories as an index</text>
<rect x="80" y="226" width="125" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="142.5" y="244" class="sans m" font-size="14" text-anchor="middle">≤ 6,000 chars</text>
<path d="M550,101 V126" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="400" y="128" width="300" height="140" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="420" y="160" class="mono a b" font-size="17" text-anchor="start">recall --hook</text>
<text x="420" y="188" class="sans t" font-size="15" text-anchor="start">Injects up to 3 memories</text>
<text x="420" y="210" class="sans t" font-size="15" text-anchor="start">relevant to this prompt</text>
<rect x="420" y="226" width="204" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="522.0" y="244" class="sans m" font-size="14" text-anchor="middle">&lt; 300 ms · never blocks</text>
<path d="M890,101 V126" fill="none" stroke="#9198A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="740" y="128" width="300" height="140" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="760" y="160" class="mono a b" font-size="17" text-anchor="start">summarize --hook</text>
<text x="760" y="188" class="sans t" font-size="15" text-anchor="start">Writes a session summary</text>
<text x="760" y="210" class="sans t" font-size="15" text-anchor="start">from the transcript</text>
<rect x="760" y="226" width="157" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="838.5" y="244" class="sans m" font-size="14" text-anchor="middle">background worker</text>
<rect x="60" y="330" width="980" height="64" rx="10" fill="#1F1B3D" stroke="#4B4199" stroke-width="1.5"/>
<text x="80" y="369" class="mono a b" font-size="18" text-anchor="start">memory.db</text>
<text x="190" y="369" class="sans m" font-size="15" text-anchor="start">SQLite · FTS5 trigram · feedback · til · summary · knowledge</text>
<path d="M210,328 V270" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="222" y="304" class="sans a" font-size="14" text-anchor="start">inject into context</text>
<path d="M550,328 V270" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="562" y="304" class="sans a" font-size="14" text-anchor="start">inject into context</text>
<path d="M890,270 V328" fill="none" stroke="#A196FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="902" y="304" class="sans a" font-size="14" text-anchor="start">store summary</text>
</svg>
