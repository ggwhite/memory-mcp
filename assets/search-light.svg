<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="384" viewBox="0 0 1100 384" role="img" aria-labelledby="title desc">
<title id="title">How search works</title>
<desc id="desc">A query runs through FTS5 trigram with bm25 ranking and, if Ollama is reachable, vector search; the two rankings are merged with Reciprocal Rank Fusion. If Ollama is down, search falls back to FTS5 only. Summaries decay with a 90-day half-life down to a floor of 0.25; other types never decay.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t  { fill: #1F2328; }
  .m  { fill: #59636E; }
  .a  { fill: #5B4BDB; }
  .oa { fill: #FFFFFF; }
  .b  { font-weight: 600; }
  .cap { font-size: 14px; letter-spacing: 1.2px; font-weight: 600; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#59636E"/>
  </marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#5B4BDB"/>
  </marker>
</defs>
<rect width="1100" height="384" fill="#FFFFFF"/>
<rect x="40" y="148" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="115" y="175" class="sans t b" font-size="17" text-anchor="middle">Query</text>
<text x="115" y="197" class="sans m" font-size="14" text-anchor="middle">3+ chars · CJK</text>
<path d="M190,180 H230" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M230,180 V95 H268" fill="none" stroke="#5B4BDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<path d="M230,180 V265 H268" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="270" y="56" width="220" height="78" rx="10" fill="#EFEDFF" stroke="#C4BCF5" stroke-width="1.5"/>
<text x="290" y="86" class="sans t b" font-size="17" text-anchor="start">FTS5 trigram</text>
<text x="290" y="110" class="sans m" font-size="14" text-anchor="start">bm25 ranking · always on</text>
<rect x="270" y="226" width="220" height="78" rx="10" fill="#FFFFFF" stroke="#59636E" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="290" y="256" class="sans t b" font-size="17" text-anchor="start">Vector search</text>
<text x="290" y="280" class="sans m" font-size="14" text-anchor="start">Ollama · bge-m3 · optional</text>
<text x="270" y="334" class="sans m" font-size="14" text-anchor="start" font-style="italic">Ollama unreachable → silently falls back to FTS5 only</text>
<path d="M490,95 H530 V166 H568" fill="none" stroke="#5B4BDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<path d="M490,265 H530 V194 H568" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="570" y="132" width="190" height="96" rx="10" fill="#5B4BDB" stroke="#5B4BDB" stroke-width="1.5"/>
<text x="665" y="166" class="sans oa b" font-size="17" text-anchor="middle">Reciprocal</text>
<text x="665" y="188" class="sans oa b" font-size="17" text-anchor="middle">Rank Fusion</text>
<text x="665" y="212" class="mono oa" font-size="14" text-anchor="middle">Σ 1 / (k + rank)</text>
<path d="M760,180 H838" fill="none" stroke="#5B4BDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<rect x="840" y="148" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="860" y="175" class="sans t b" font-size="17" text-anchor="start">Ranked results</text>
<text x="860" y="197" class="sans m" font-size="14" text-anchor="start">index lines → get by id</text>
<rect x="780" y="246" width="280" height="114" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="798" y="272" class="sans t b" font-size="15" text-anchor="start">Summary recency decay</text>
<text x="798" y="296" class="sans m" font-size="14" text-anchor="start">half-life 90 days · floor 0.25</text>
<text x="798" y="318" class="sans m" font-size="14" text-anchor="start">other types never decay</text>
<text x="798" y="340" class="sans m" font-size="14">ranks <tspan class="mono a">recall --hook</tspan> hits</text>
<style>.fx .h{fill:var(--k,#5B4BDB);opacity:.28}.fx .c{fill:var(--k,#5B4BDB)}.fx .pko .h{opacity:.14}.fx .pko .c{opacity:.6}.fx .eg{fill:none;stroke:#5B4BDB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.fx .ego{fill:none;stroke:#5B4BDB;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}.fx .bx{fill:none;stroke:#5B4BDB;stroke-width:2.5}.fx .rg{fill:none;stroke:#5B4BDB;stroke-width:1.5}@keyframes march{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fx *{animation:none!important}}@keyframes b1{0%{opacity:0}2%{opacity:0.7}5%{opacity:0.7}13.33%{opacity:0}100%{opacity:0}}.b1{animation:b1 6.0s ease-in-out infinite}@keyframes e2{0%{opacity:0}5%{opacity:0}7%{opacity:0.45}11.67%{opacity:0.45}17.5%{opacity:0}100%{opacity:0}}.e2{animation:e2 6.0s linear infinite}@keyframes p3{0%{opacity:0;transform:translate(190px,180px)}5%{opacity:0;transform:translate(190px,180px)}7%{opacity:1}9.67%{opacity:1}11.67%{transform:translate(230px,180px);opacity:0}100%{opacity:0;transform:translate(230px,180px)}}.p3{animation:p3 6.0s linear infinite}@keyframes e4{0%{opacity:0}11.67%{opacity:0}13.67%{opacity:0.45}25%{opacity:0.45}30.83%{opacity:0}100%{opacity:0}}.e4{animation:e4 6.0s linear infinite}@keyframes p5{0%{opacity:0;transform:translate(230px,180px)}11.67%{opacity:0;transform:translate(230px,180px)}13.67%{opacity:1}20.88%{transform:translate(230px,95px)}23%{opacity:1}25%{transform:translate(268px,95px);opacity:0}100%{opacity:0;transform:translate(268px,95px)}}.p5{animation:p5 6.0s linear infinite}@keyframes e6{0%{opacity:0}11.67%{opacity:0}13.67%{opacity:0.35}25%{opacity:0.35}30.83%{opacity:0}100%{opacity:0}}.e6{animation:e6 6.0s linear infinite,march .8s linear infinite}@keyframes p7{0%{opacity:0;transform:translate(230px,180px)}11.67%{opacity:0;transform:translate(230px,180px)}13.67%{opacity:1}20.88%{transform:translate(230px,265px)}23%{opacity:1}25%{transform:translate(268px,265px);opacity:0}100%{opacity:0;transform:translate(268px,265px)}}.p7{animation:p7 6.0s linear infinite}@keyframes b8{0%{opacity:0}25%{opacity:0}27%{opacity:0.7}31.67%{opacity:0.7}40%{opacity:0}100%{opacity:0}}.b8{animation:b8 6.0s ease-in-out infinite}@keyframes b9{0%{opacity:0}25%{opacity:0}27%{opacity:0.35}31.67%{opacity:0.35}40%{opacity:0}100%{opacity:0}}.b9{animation:b9 6.0s ease-in-out infinite}@keyframes e10{0%{opacity:0}33.33%{opacity:0}35.33%{opacity:0.45}48.33%{opacity:0.45}54.17%{opacity:0}100%{opacity:0}}.e10{animation:e10 6.0s linear infinite}@keyframes p11{0%{opacity:0;transform:translate(490px,95px)}33.33%{opacity:0;transform:translate(490px,95px)}35.33%{opacity:1}37.36%{transform:translate(530px,95px)}44.51%{transform:translate(530px,166px)}46.33%{opacity:1}48.33%{transform:translate(568px,166px);opacity:0}100%{opacity:0;transform:translate(568px,166px)}}.p11{animation:p11 6.0s linear infinite}@keyframes e12{0%{opacity:0}33.33%{opacity:0}35.33%{opacity:0.35}48.33%{opacity:0.35}54.17%{opacity:0}100%{opacity:0}}.e12{animation:e12 6.0s linear infinite,march .8s linear infinite}@keyframes p13{0%{opacity:0;transform:translate(490px,265px)}33.33%{opacity:0;transform:translate(490px,265px)}35.33%{opacity:1}37.36%{transform:translate(530px,265px)}44.51%{transform:translate(530px,194px)}46.33%{opacity:1}48.33%{transform:translate(568px,194px);opacity:0}100%{opacity:0;transform:translate(568px,194px)}}.p13{animation:p13 6.0s linear infinite}@keyframes b14{0%{opacity:0}48.33%{opacity:0}50.33%{opacity:0.7}55%{opacity:0.7}63.33%{opacity:0}100%{opacity:0}}.b14{animation:b14 6.0s ease-in-out infinite}@keyframes e15{0%{opacity:0}56.67%{opacity:0}58.67%{opacity:0.45}68.33%{opacity:0.45}74.17%{opacity:0}100%{opacity:0}}.e15{animation:e15 6.0s linear infinite}@keyframes p16{0%{opacity:0;transform:translate(760px,180px)}56.67%{opacity:0;transform:translate(760px,180px)}58.67%{opacity:1}66.33%{opacity:1}68.33%{transform:translate(838px,180px);opacity:0}100%{opacity:0;transform:translate(838px,180px)}}.p16{animation:p16 6.0s linear infinite}@keyframes b17{0%{opacity:0}68.33%{opacity:0}70.33%{opacity:0.7}76.67%{opacity:0.7}85%{opacity:0}100%{opacity:0}}.b17{animation:b17 6.0s ease-in-out infinite}</style>
<g class="fx" aria-hidden="true"><rect class="bx b1" opacity="0" x="40" y="148" width="150" height="64" rx="10"/><path class="eg e2" d="M190,180 L230,180" opacity="0"/><g class="pk p3" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><path class="eg e4" d="M230,180 L230,95 L268,95" opacity="0"/><g class="pk p5" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><path class="ego e6" d="M230,180 L230,265 L268,265" opacity="0"/><g class="pko p7" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b8" opacity="0" x="270" y="56" width="220" height="78" rx="10"/><rect class="bx b9" opacity="0" x="270" y="226" width="220" height="78" rx="10"/><path class="eg e10" d="M490,95 L530,95 L530,166 L568,166" opacity="0"/><g class="pk p11" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><path class="ego e12" d="M490,265 L530,265 L530,194 L568,194" opacity="0"/><g class="pko p13" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b14" opacity="0" x="566" y="128" width="198" height="104" rx="13"/><path class="eg e15" d="M760,180 L838,180" opacity="0"/><g class="pk p16" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b17" opacity="0" x="840" y="148" width="220" height="64" rx="10"/></g>
</svg>
