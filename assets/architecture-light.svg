<text x="420" y="190" class="mono a b" font-size="19" text-anchor="middle">db.Store</text>
<text x="420" y="214" class="sans m" font-size="14" text-anchor="middle">Go interface</text>
<path d="M510,196 H588" fill="none" stroke="#5B4BDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="549" y="184" class="sans m" font-size="14" text-anchor="middle">local</text>
<rect x="590" y="148" width="180" height="96" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="680" y="190" class="mono t b" font-size="18" text-anchor="middle">internal/db</text>
<text x="680" y="214" class="sans m" font-size="14" text-anchor="middle">redact · search · RRF</text>
<path d="M770,196 H848" fill="none" stroke="#5B4BDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
