version: 2

builds:
  - id: memory-mcp
    main: .
    binary: memory-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ggwhite/memory-mcp/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "memory-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
